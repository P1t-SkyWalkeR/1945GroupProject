<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UST Course Vibe Match</title>
<style>
  :root {
    color-scheme: light;
    --page: #f4f7fc;
    --white: #fff;
    --ink: #131d39;
    --muted: #4b5973;
    --line: #cbd6e8;
    --blue: #1748ce;
    --blue-dark: #1239a5;
    --ice: #e5effd;
    --good: #137a3f;
    --good-bg: #e6f4ea;
    --bad: #b3261e;
    --bad-bg: #fbeae9;
    --gold: #8a5a00;
    --gold-bg: #fff3da;
    --radius: 11px;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, sans-serif; }
  .frame { width: min(calc(100% - 48px), 1500px); margin-inline: auto; }
  .top { border-bottom: 1px solid var(--line); background: var(--white); }
  .top .frame { padding: 18px 0; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 16px; }
  h1 { margin: 0; font: 700 clamp(1.3rem, 2.5vw, 1.9rem)/1.1 Georgia, serif; }
  .sub { margin: 0; color: var(--muted); font-size: .92rem; }
  main { padding: 22px 0 40px; }
  .layout { display: grid; grid-template-columns: minmax(340px, .42fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  .panel { border: 1px solid var(--line); background: var(--white); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px; }
  .panel h2 { margin: 0 0 4px; font: 700 1.15rem/1.2 Georgia, serif; }
  .panel h2 .muted { font-size: .82rem; font-weight: 500; color: var(--muted); }
  .hint { margin: 0 0 12px; color: var(--muted); font-size: .84rem; }
  .checks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 10px; }
  .check { display: flex; align-items: center; gap: 8px; padding: 6px 7px; border-radius: 7px; cursor: pointer; font-size: .87rem; }
  .check:hover { background: var(--ice); }
  .check input { accent-color: var(--blue); margin: 0; }
  .check .code { font: 650 .82rem/1 ui-monospace, SFMono-Regular, monospace; color: var(--blue-dark); min-width: 46px; }
  .check .area-name { color: var(--muted); }
  .rows { display: grid; gap: 7px; }
  .item { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .item-name { font-weight: 600; font-size: .9rem; }
  .vibe-item { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .vibe-item:last-child { border-bottom: 0; }
  .seg { display: inline-flex; border: 1px solid #b8c7df; border-radius: 8px; overflow: hidden; }
  .seg label { display: flex; align-items: center; cursor: pointer; flex-shrink: 0; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg span { padding: 5px 12px; font-size: .82rem; color: var(--ink); border-left: 1px solid #9db0d0; background: var(--white); white-space: nowrap; }
  .seg label:first-child span { border-left: 0; }
  .seg input:checked + span { background: var(--blue); color: #fff; font-weight: 650; }
  .results-panel { padding: 0; border: 0; background: transparent; margin-bottom: 0; }
  .results-panel h2 { padding: 0 4px; }
  .results-panel h2 .muted { font-size: .82rem; font-weight: 500; color: var(--muted); margin-left: 8px; }
  .card { border: 1px solid var(--line); background: var(--white); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; }
  .card-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .code { font: 700 .78rem/1.4 ui-monospace, SFMono-Regular, monospace; color: var(--blue-dark); }
  .card h3 { margin: 0; font-size: 1.08rem; line-height: 1.25; }
  .bingo { background: var(--good); color: #fff; font-size: .72rem; font-weight: 700; letter-spacing: .04em; padding: 2px 9px; border-radius: 999px; text-transform: uppercase; }
  .meta { color: var(--muted); font-size: .82rem; margin: 4px 0 8px; }
  .match { font-weight: 650; margin: 2px 0 8px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 8px; }
  .badge { font-size: .78rem; font-weight: 650; padding: 2px 9px; border-radius: 999px; }
  .badge.fit { background: var(--good-bg); color: var(--good); }
  .badge.mismatch { background: var(--bad-bg); color: var(--bad); }
  .badge.nice {
    position: relative;
    display: inline-block;
    overflow: hidden;
    background: linear-gradient(135deg, #ffd75e, #ffb400, #ffd75e);
    color: #4a2e00;
    border: 1px solid #ffb400;
    font-weight: 800;
    text-shadow: 0 1px 0 rgba(255, 255, 255, .35);
    animation: niceglow 1.8s ease-in-out infinite;
  }
  .badge.nice::after {
    content: "";
    position: absolute;
    top: -60%;
    left: -70%;
    width: 45%;
    height: 220%;
    background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .85), transparent);
    transform: rotate(18deg);
    animation: shine 2.4s ease-in-out infinite;
  }
  @keyframes shine {
    0% { left: -70%; }
    55%, 100% { left: 140%; }
  }
  @keyframes niceglow {
    0%, 100% { box-shadow: 0 2px 8px rgba(255, 180, 0, .55); }
    50% { box-shadow: 0 2px 18px rgba(255, 180, 0, .9); }
  }
  .nodata { color: var(--muted); font-style: italic; margin: 6px 0; }
  .detail { list-style: none; margin: 0 0 6px; padding: 0; font-size: .84rem; display: grid; gap: 2px; }
  .detail li { padding: 2px 8px; border-radius: 5px; }
  .detail li.hit { background: var(--good-bg); color: var(--good); }
  .detail li.miss { background: var(--bad-bg); color: var(--bad); }
  .detail li.unknown { background: #eef1f6; color: var(--muted); }
  .reviews { color: var(--muted); font-size: .78rem; margin: 6px 0 0; }
  .empty { border: 1px dashed var(--line); background: var(--ice); border-radius: var(--radius); padding: 26px; text-align: center; color: var(--muted); }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } .checks { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="top">
  <div class="frame">
    <h1>UST Course Vibe Match</h1>
    <p class="sub">Filter common-core courses by area (hard) and assessment fit (yes/no).</p>
  </div>
</header>
<main class="frame">
  <form id="preferences" class="layout">
    <div>
      <section class="panel">
        <h2>Describe urself here:</h2>
        <div id="vibe" class="rows"></div>
      </section>
      <section class="panel">
        <div id="areas" class="checks"></div>
      </section>
      <section class="panel">
        <h2>Assessments <span class="muted">— yes / no</span></h2>
        <p class="hint">For each item, choose whether you want the course to <b>have</b> it (Yes), <b>not have</b> it (No), or you don't mind (—).</p>
        <div id="assessments" class="rows"></div>
      </section>
    </div>
    <section class="results-panel">
      <h2>Results<span id="count" class="muted"></span></h2>
      <div id="results"></div>
    </section>
  </form>
</main>

,"essay":"unknown","project":"unknown","attendance":"unknown","reading":"unknown","presentation":"unknown"},"review_count":0,"vibe":{"memorization":"unknown","assessment_difficulty":"unknown","workload":"unknown","grading_leniency":"unknown","teaching_clarity":"unknown"}},{"code":"UTOP2910","title":"Pathways to Teaching for Future Educators","areas":["UTOP"],"assessment":{"midterm":"unknown","final":"unknown","quiz":"unknown","assignment":"unknown","essay":"unknown","project":"unknown","attendance":"unknown","reading":"unknown","presentation":"unknown"},"review_count":0,"vibe":{"memorization":"unknown","assessment_difficulty":"unknown","workload":"unknown","grading_leniency":"unknown","teaching_clarity":"unknown"}},{"code":"UTOP3201","title":"Practicum in STEAM Education","areas":["UTOP"],"assessment":{"midterm":"unknown","final":"unknown","quiz":"unknown","assignment":"unknown","essay":"unknown","project":"unknown","attendance":"unknown","reading":"unknown","presentation":"unknown"},"review_count":0,"vibe":{"memorization":"unknown","assessment_difficulty":"unknown","workload":"unknown","grading_leniency":"unknown","teaching_clarity":"unknown"}}]}</script>
<script>
(function () {
  "use strict";
  var data = JSON.parse(document.getElementById("preview-data").textContent);
  var ORDER = { weak: 0, moderate: 1, strong: 2 };

  function el(tag, className, text) {
    var e = document.createElement(tag);
    if (className) e.className = className;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  var form = document.getElementById("preferences");
  var results = document.getElementById("results");
  var countEl = document.getElementById("count");
  var areaWrap = document.getElementById("areas");
  var assessWrap = document.getElementById("assessments");
  var vibeWrap = document.getElementById("vibe");

  data.areas.forEach(function (code) {
    var label = el("label", "check");
    var input = el("input");
    input.type = "checkbox";
    input.name = "area";
    input.value = code;
    label.appendChild(input);
    label.appendChild(el("span", "code", code));
    label.appendChild(el("span", "area-name", data.area_labels[code]));
    areaWrap.appendChild(label);
  });

  data.assessments.forEach(function (item) {
    var row = el("label", "item");
    row.appendChild(el("span", "item-name", data.assessment_labels[item]));
    var seg = el("span", "seg");
    function make(value, labelText, checked) {
      var lab = el("label");
      var inp = el("input");
      inp.type = "radio";
      inp.name = item;
      inp.value = value;
      if (checked) inp.checked = true;
      lab.appendChild(inp);
      lab.appendChild(el("span", null, labelText));
      return lab;
    }
    seg.appendChild(make("yes", "Yes"));
    seg.appendChild(make("no", "No"));
    seg.appendChild(make("", "Don't care", true));
    row.appendChild(seg);
    assessWrap.appendChild(row);
  });

  data.vibe_dimensions.forEach(function (dim) {
    var row = el("label", "vibe-item");
    row.appendChild(el("span", "item-name", data.vibe_labels[dim]));
    var seg = el("span", "seg");
    function makeV(value, labelText, checked) {
      var lab = el("label");
      var inp = el("input");
      inp.type = "radio";
      inp.name = "vibe_" + dim;
      inp.value = value;
      if (checked) inp.checked = true;
      lab.appendChild(inp);
      lab.appendChild(el("span", null, labelText));
      return lab;
    }
    var choices = data.vibe_choices[dim];
    seg.appendChild(makeV("weak", choices.weak));
    seg.appendChild(makeV("moderate", choices.moderate));
    seg.appendChild(makeV("strong", choices.strong));
    seg.appendChild(makeV("", "Don't care", true));
    row.appendChild(seg);
    vibeWrap.appendChild(row);
  });

  function vibeBadges(c, vibePrefs) {
    var badges = [];
    data.vibe_dimensions.forEach(function (dim) {
      var want = vibePrefs[dim];
      var have = c.vibe[dim];
      if (!want || have === "unknown") return;
      var diff = Math.abs(ORDER[want] - ORDER[have]);
      if (diff === 0) badges.push({ type: "fit", text: data.vibe_labels[dim] + " fits you" });
      else if (diff === 2) badges.push({ type: "mismatch", text: data.vibe_labels[dim] + " doesn't fit you" });
    });
    if (c.vibe.grading_leniency === "lenient") badges.push({ type: "nice", text: "Lenient grading" });
    if (c.vibe.teaching_clarity === "clear") badges.push({ type: "nice", text: "Good clarity of teaching" });
    return badges;
  }

  function render() {
    var fd = new FormData(form);
    var areas = fd.getAll("area");
    var wanted = {}, vibePrefs = {};
    data.assessments.forEach(function (item) { wanted[item] = fd.get(item) || ""; });
    data.vibe_dimensions.forEach(function (dim) { vibePrefs[dim] = fd.get("vibe_" + dim) || ""; });

    var pool = data.courses;
    if (areas.length) {
      pool = pool.filter(function (c) {
        return c.areas.some(function (a) { return areas.indexOf(a) !== -1; });
      });
    }

    var scored = pool.map(function (c) {
      var hits = 0, known = 0, detail = [];
      data.assessments.forEach(function (item) {
        var want = wanted[item];
        var have = c.assessment[item];
        if (!want) return;
        if (have === "unknown") { detail.push({ item: item, state: "unknown" }); return; }
        known++;
        if (have === want) { hits++; detail.push({ item: item, state: "hit", have: have }); }
        else { detail.push({ item: item, state: "miss", have: have }); }
      });
      var badges = vibeBadges(c, vibePrefs);
      var addonScore = badges.reduce(function (acc, b) { return acc + (b.type === "mismatch" ? -1 : 1); }, 0);
      return { c: c, hits: hits, known: known, detail: detail, score: known ? hits / known : null, badges: badges, addonScore: addonScore };
    });

    scored.sort(function (a, b) {
      if (a.score === null && b.score === null) return (b.addonScore - a.addonScore) || (a.c.code < b.c.code ? -1 : 1);
      if (a.score === null) return 1;
      if (b.score === null) return -1;
      return (b.score - a.score) || (b.addonScore - a.addonScore) || (a.c.code < b.c.code ? -1 : 1);
    });

    countEl.textContent = scored.length + " of " + data.courses.length + " courses";
    results.replaceChildren();
    if (!scored.length) {
      results.appendChild(el("p", "empty", "No courses match the selected area(s)."));
      return;
    }
    scored.forEach(function (s) { results.appendChild(renderCard(s)); });
  }

  function renderCard(s) {
    var c = s.c;
    var card = el("article", "card");
    var head = el("div", "card-head");
    head.appendChild(el("span", "code", c.code));
    head.appendChild(el("h3", null, c.title));
    if (s.score === 1 && s.known > 0) head.appendChild(el("span", "bingo", "Bingo"));
    card.appendChild(head);

    card.appendChild(el("div", "meta", (c.areas.length ? c.areas.join(" · ") : "no area")));

    if (s.score === null) {
      card.appendChild(el("p", "nodata", "No assessment data for the items you chose."));
    } else {
      var pct = Math.round(s.score * 100);
      card.appendChild(el("p", "match", s.hits + " / " + s.known + " match · " + pct + "%"));
    }

    if (s.badges.length) {
      var bar = el("div", "badges");
      s.badges.forEach(function (b) { bar.appendChild(el("span", "badge " + b.type, b.text)); });
      card.appendChild(bar);
    }

    if (s.score !== null && s.detail.length) {
      var det = el("ul", "detail");
      s.detail.forEach(function (d) {
        var label = data.assessment_labels[d.item];
        if (d.state === "hit") det.appendChild(el("li", "hit", (d.have === "yes" ? "Has " : "No ") + label));
        else if (d.state === "miss") det.appendChild(el("li", "miss", (d.have === "yes" ? "Has " : "No ") + label));
        else det.appendChild(el("li", "unknown", label + " — no data"));
      });
      card.appendChild(det);
    }
    if (c.review_count) card.appendChild(el("p", "reviews", c.review_count + " review" + (c.review_count === 1 ? "" : "s")));
    return card;
  }

  form.addEventListener("change", render);
  form.addEventListener("submit", function (e) { e.preventDefault(); });
  render();
})();
</script>
